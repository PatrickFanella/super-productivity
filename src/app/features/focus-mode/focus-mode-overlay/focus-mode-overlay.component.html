<div class="electron-drag-bar"></div>

<div
  class="focus-mode-dialog"
  role="dialog"
  [attr.aria-label]="T.GCF.APP_FEATURES.FOCUS_MODE | translate"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
>
  <header>
    <banner></banner>
  </header>
  @if (activePage()) {
    <main>
      <button
        class="close-btn"
        mat-icon-button
        (click)="closeOverlay()"
        [attr.aria-label]="T.G.CLOSE | translate"
      >
        <mat-icon>close</mat-icon>
      </button>

      <!-- Mode selector is now integrated into focus-mode-main component -->

      @if (focusModeService.isSharedSessionMirror()) {
        <aside
          class="shared-session-handoff"
          role="status"
        >
          <span>{{ T.F.FOCUS_MODE.RUNNING_ON_ANOTHER_DEVICE | translate }}</span>
          <button
            mat-flat-button
            color="primary"
            (click)="takeOverSharedSession()"
          >
            {{ T.F.FOCUS_MODE.TAKE_OVER_ON_THIS_DEVICE | translate }}
          </button>
        </aside>
      }

      <!-- -->
      <div
        class="focus-session-content"
        [attr.inert]="focusModeService.isSharedSessionMirror() ? '' : null"
      >
        @switch (activePage()) {
          <!-- -->
          @case (FocusScreen.Main) {
            <focus-mode-main @warpIn></focus-mode-main>
          }
          @case (FocusScreen.SessionDone) {
            <focus-mode-session-done @warpIn></focus-mode-session-done>
          }
          @case (FocusScreen.Break) {
            <focus-mode-break @warpIn></focus-mode-break>
          }
        }
      </div>
    </main>
  }
</div>
